# Firebase App Hosting — runtime config
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# NEXT_PUBLIC_FIREBASE_* no van aquí (GitHub las marca como secret).
# Configúralas en App Hosting → Configuración → Entorno.

env:
  - variable: GA4_PROPERTY_ID
    value: "419811918"
    availability:
      - BUILD
      - RUNTIME

  # Service account JSON en Cloud Secret Manager (nunca en git).
  - variable: GA4_SERVICE_ACCOUNT_JSON
    secret: GA4_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
